<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyChief Tic Tac Toe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f0f1e;
            color: #fff;
            font-family: 'Press Start 2P', system-ui;
            text-align: center;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 0 10px #0ff; }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 12px;
            background: #1a1a2e;
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }
        .cell {
            background: #16213e;
            border-radius: 12px;
            font-size: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #0ff;
            box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.2);
        }
        .cell:hover { background: #0f3460; }
        .cell.x { color: #ff00aa; }
        .cell.o { color: #00ffaa; }
        .status {
            margin-top: 20px;
            font-size: 1.2rem;
            min-height: 30px;
        }
        button {
            margin-top: 20px;
            padding: 15px 30px;
            font-family: 'Press Start 2P', system-ui;
            font-size: 1rem;
            background: #ff00aa;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff00aa;
        }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <h1>SKYCHIEF TIC TAC TOE</h1>
    <div class="board" id="board"></div>
    <div class="status" id="status">Player X's turn</div>
    <button onclick="resetGame()">NEW GAME</button>
